# =============================================================================
# CI Pipeline — BpaY Fintech Frontend
# =============================================================================
# Runs on every pull request to main.
# 5-stage pipeline: lint → typecheck → test → build → security
#
# Design principles:
#   - Fail fast: cheapest checks run first
#   - Hermetic: no reliance on developer machines
#   - Least privilege: read-only permissions
#   - Deterministic: frozen lockfile, pinned actions
#   - Auditable: every check produces traceable output
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  # Also run on push to main to ensure merge commits are validated
  push:
    branches: [main]

# ---------------------------------------------------------------------------
# Permissions — least privilege by default
# ---------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: read

# ---------------------------------------------------------------------------
# Concurrency — cancel in-progress runs for the same PR
# ---------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  # =========================================================================
  # Stage 1 — Code Quality (Lint + Format Validation)
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # =========================================================================
  # Stage 2 — Type Safety
  # =========================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler
        run: pnpm typecheck

  # =========================================================================
  # Stage 3 — Unit & Integration Tests
  # =========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # =========================================================================
  # Stage 4 — Build Validation
  # =========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build depends on quality checks — no point building if code is broken
    needs: [lint, typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build
        env:
          # Provide build-time environment variables
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/
          # Fail on Next.js build warnings (treats them as errors)
          CI: true

      - name: Report build output size
        run: |
          echo "## Build Output Size" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh .next/ 2>/dev/null || echo "No .next directory found"
          du -sh .next/static/ 2>/dev/null || echo "No static directory found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  # =========================================================================
  # Stage 5 — Dependency Security Audit
  # =========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities (summary)
        run: |
          echo "## Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pnpm audit --audit-level=high 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Commit Message Validation (PR only)
  # =========================================================================
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
